name: Matrix evidence verification

# Copy this file to .github/workflows/matrix_verification.yml in your repository.
# Replace baseline.sciproof.json below with path to your committed SciProof manifest.
# This default check verifies artifact integrity only; it does not execute manifest command.
# Passing every job does not prove cross-platform numerical reproducibility. See docs/CI.md
# for trusted reruns and calibration guidance.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install SciProof
        run: python -m pip install "sciproof==0.6.0"
      - name: Verify evidence integrity
        run: sciproof verify baseline.sciproof.json --format markdown
