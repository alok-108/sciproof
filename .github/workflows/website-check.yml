name: Website check

# Runs on pull requests that change the website or the documents it is built from.
# - Builds the site; the build fails on broken INTERNAL links and anchors (scripts/check-links.mjs).
# - Checks EXTERNAL links with lychee (reported, but a flaky third-party site does not block a PR).
# - Runs Lighthouse CI; the four category scores must be at least 90.
#
# Only the unprivileged pull_request trigger is used, with a read-only token and no secrets.

on:
  pull_request:
    paths:
      - website/**
      - docs/**
      - README.md
      - CONTRIBUTING.md
      - SECURITY.md
      - MAINTAINERS.md
      - pyproject.toml
      - src/sciproof/cli.py
      - .github/workflows/website*.yml

permissions:
  contents: read

jobs:
  check:
    name: Build, links, Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install website dependencies
        working-directory: website
        run: npm ci
      - name: Build (fails on broken internal links)
        working-directory: website
        run: npm run build
        env:
          # read-only token supplied by GitHub for pull requests; only used for public API reads
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # No base URL: root-relative (internal) links are skipped here, they were checked by the build.
          args: >-
            --no-progress
            --max-retries 2
            --accept 200,201,202,203,204,206,429
            --scheme https
            --exclude 'issues/new'
            --exclude 'api\.github\.com'
            'website/dist/**/*.html'
          fail: false
          jobSummary: true
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: website/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
