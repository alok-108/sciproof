name: CI

# Security notes
# - Only the unprivileged `pull_request` trigger is used. Never switch this to
#   `pull_request_target` (it would run untrusted pull-request code with a privileged token).
# - The token is read-only and no secrets are used.
# - Third-party actions are referenced by major version tag; pin them to commit SHAs when the
#   project grows (Dependabot can keep the pins up to date).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: python -m pytest
      - name: End-to-end demo
        run: python examples/demo.py
  coverage:
    name: Coverage report (Linux, Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Coverage
        run: python -m coverage run -m pytest
      - name: Report
        if: always()
        run: python -m coverage report -m
